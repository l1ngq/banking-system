networks:
  banking-network:
    name: banking-network
    driver: bridge

volumes:
  postgres-core-data:
    name: postgres-core-data
  postgres-currencies-data:
    name: postgres-currencies-data
  kafka-1-data:
    name: kafka-1-data
  redis-master-data:
    name: redis-master-data

services:

  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=balykhin.maxim@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - banking-network

  banking-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/banking-frontend:${WEB_VERSION:-latest}
    container_name: banking-frontend-container
    env_file:
      - .env.versions
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`iate.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.frontend.priority=1"
    restart: unless-stopped
    networks:
      - banking-network

  postgres-core:
    image: postgres:18.4
    env_file:
      - .env.secrets
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_db
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres", "-c", "log_statement=ddl", "-c", "log_min_duration_statement=200ms"]
    volumes:
      - postgres-core-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - banking-network

  postgres-currencies:
    image: postgres:18.4
    env_file:
      - .env.secrets
    restart: unless-stopped
    environment:
      POSTGRES_DB: currencies_db
    ports:
      - "127.0.0.1:5433:5432"
    command: ["postgres", "-c", "log_statement=ddl", "-c", "log_min_duration_statement=200ms"]
    volumes:
      - postgres-currencies-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - banking-network

  kafka-1:
    image: confluentinc/cp-kafka:8.1.3
    env_file:
      - .env.secrets
    container_name: kafka-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    networks:
      - banking-network

  redis-master:
    image: redis:8.6.3
    env_file:
      - .env.secrets
    container_name: redis-master
    restart: unless-stopped
    command:
      - redis-server
      - --save 60 1
      - --maxmemory 512mb
      - --maxmemory-policy volatile-ttl
      - --maxmemory-samples 5
      - --port 6379
      - --bind 0.0.0.0
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - banking-network

  currencies-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/banking-currencies:${CURRENCIES_VERSION:-latest}
    container_name: banking-currencies
    env_file:
      - .env.secrets
    environment:
      CURRENCIES_DATABASE_URL: jdbc:postgresql://postgres-currencies:5432/currencies_db
      APP_DATABASE_SCHEMA: currencies
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.currencies.rule=Host(`iate.space`) && PathPrefix(`/currencies-api`)"
      - "traefik.http.routers.currencies.entrypoints=websecure"
      - "traefik.http.routers.currencies.tls.certresolver=myresolver"
      - "traefik.http.routers.currencies.priority=100"
      - "traefik.http.routers.currencies.middlewares=currencies-stripprefix"
      - "traefik.http.middlewares.currencies-stripprefix.stripprefix.prefixes=/currencies-api"
      - "traefik.http.services.currencies.loadbalancer.server.port=8081"
    restart: unless-stopped
    depends_on:
      postgres-currencies:
        condition: service_healthy
    networks:
      - banking-network

  core-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/banking-core:${CORE_VERSION:-latest}
    container_name: banking-core
    env_file:
      - .env.secrets
    environment:
      CORE_DATABASE_URL: jdbc:postgresql://postgres-core:5432/core_db
      APP_DATABASE_SCHEMA: banking
      LIQUIBASE_SCHEMA: public
      BOOTSTRAP_SERVERS: kafka-1:9092
      KAFKA_LISTENER_AUTO_STARTUP: "true"
      CURRENCIES_SERVICE_URL: http://currencies-service:8081
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: https://iate.space
      SCHEDULING_ENABLED: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=Host(`iate.space`) && PathPrefix(`/core-api`)"
      - "traefik.http.routers.core.entrypoints=websecure"
      - "traefik.http.routers.core.tls.certresolver=myresolver"
      - "traefik.http.routers.core.priority=100"
      - "traefik.http.routers.core.middlewares=core-stripprefix"
      - "traefik.http.middlewares.core-stripprefix.stripprefix.prefixes=/core-api"
      - "traefik.http.services.core.loadbalancer.server.port=8080"
    restart: unless-stopped
    depends_on:
      postgres-core:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      currencies-service:
        condition: service_started
    networks:
      - banking-network
