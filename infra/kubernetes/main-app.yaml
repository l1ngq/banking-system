apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-infrastructure
  namespace: argocd
spec:
  project: banking
  source:
    repoURL: "https://github.com/l1ngq/banking-system.git"
    targetRevision: main
    path: infra/kubernetes/infrastructure
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: banking-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
