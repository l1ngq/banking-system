---
- name: Install K3s Agent
  shell: >
    curl -sfL https://get.k3s.io |
    K3S_URL=https://{{ hostvars['k3s-master'].internal_ip }}:6443
    K3S_TOKEN={{ hostvars['k3s-master']['k3s_token']['stdout'] }}
    INSTALL_K3S_EXEC="agent --node-ip {{ internal_ip }} --flannel-iface=enp0s8"
    sh -
  args:
    creates: /etc/systemd/system/k3s-agent.service
  no_log: true
