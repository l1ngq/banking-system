server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend API proxy for core-service. This keeps cookies and CSRF working on one domain.
  location /core-api/ {
    proxy_pass http://core-service:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Backend API proxy for currencies-service.
  location /currencies-api/ {
    proxy_pass http://currencies-service:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Static assets can be cached aggressively because Vite adds hashes to filenames.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React/Vite SPA fallback. Prevents 404 after refresh or direct opening of routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
