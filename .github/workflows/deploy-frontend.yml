name: Deploy Frontend

on:
  push:
    tags:
      - "web-v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy
        required: true
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/banking-frontend
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./web
          push: true
          build-args: |
            VITE_CORE_API_URL=${{ secrets.PROD_CORE_API_URL }}
            VITE_CURRENCIES_API_URL=${{ secrets.PROD_CURRENCIES_API_URL }}
            VITE_INFO_API_URL=${{ secrets.PROD_INFO_API_URL }}
            VITE_ASSISTANT_API_URL=${{ secrets.PROD_ASSISTANT_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
