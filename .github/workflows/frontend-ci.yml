name: Frontend final

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - frontend-final
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install stable npm
        run: npm install -g npm@10

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build