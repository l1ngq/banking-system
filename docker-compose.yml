services:
  postgres-core:
    image: postgres:18
    container_name: postgres-core
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-currencies:
    image: postgres:18
    container_name: postgres-currencies
    restart: no
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: currencies_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d currencies_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-currencies-data:/var/lib/postgresql/data
    networks:
      - banking-network

  redis:
    image: redis:8.6.0
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - banking-network

volumes:
  postgres-core-data:
  postgres-currencies-data:

networks:
  banking-network:
    driver: bridge
