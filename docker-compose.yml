services:
  postgres-core:
    image: postgres:18
    container_name: postgres-core
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-currencies:
    image: postgres:18
    container_name: postgres-currencies
    restart: no
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: currencies_db
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d currencies_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-currencies-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-casdoor:
    image: postgres:18
    container_name: postgres-casdoor
    restart: no
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: casdoor_db
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-casdoor-data:/var/lib/postgresql/data
    networks:
      - banking-network

  redis:
    image: redis:8.6.0
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy volatile-ttl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - banking-network

  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    restart: no
    ports:
      - "8000:8000"
    depends_on:
      postgres-casdoor:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: "user=casdoor password=casdoor host=postgres-casdoor port=5432 sslmode=disable dbname=casdoor_db"
      dbName: casdoor_db
      origin: "http://localhost:8000"
    networks:
      - banking-network

  currencies-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: currencies-service
    container_name: currencies-service
    restart: no
    ports:
      - "8081:8081"
    environment:
      CURRENCIES_DATABASE_URL: jdbc:postgresql://postgres-currencies:5432/currencies_db
      DATABASE_USERNAME: bank
      DATABASE_PASSWORD: bank
      APP_DATABASE_SCHEMA: currencies
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      SCHEDULING_ENABLED: false
    depends_on:
      postgres-currencies:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network

  core-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: core-service
    container_name: core-service
    restart: no
    ports:
      - "8080:8080"
    environment:
      CORE_DATABASE_URL: jdbc:postgresql://postgres-core:5432/core_db
      DATABASE_USERNAME: bank
      DATABASE_PASSWORD: bank
      APP_DATABASE_SCHEMA: banking
      LIQUIBASE_SCHEMA: public
      BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_LISTENER_AUTO_STARTUP: true
      CURRENCIES_SERVICE_URL: http://currencies-service:8081
      SCHEDULING_ENABLED: false
      OIDC_ISSUER_URI: http://localhost:8000
      OIDC_JWK_SET_URI: http://casdoor:8000/.well-known/jwks
      OIDC_CLIENT_ID: banking-core
      OIDC_AUTHORIZATION_URL: http://localhost:8000/login/oauth/authorize
      OIDC_TOKEN_URL: http://localhost:8000/api/login/oauth/access_token
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    depends_on:
      postgres-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
      casdoor:
        condition: service_started
      currencies-service:
        condition: service_started
    networks:
      - banking-network

volumes:
  postgres-core-data:
  postgres-currencies-data:
  postgres-casdoor-data:

networks:
  banking-network:
    driver: bridge
